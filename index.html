<section class="scr on" id="start">
<h1>🏫 大石川ライフシミュレーター</h1><p class="m">大石川中等教育学校で過ごす6年間</p>
<div class="card"><b>ゲーム概要</b><br>12歳で入学し、18歳で卒業するまでの6年間を体験します。月が進むたびにイベントが起こり、あなたの選択で「健康・幸福・知識・関係」と所持金が変わります。目標は、希望の大学へ進学すること。名前もクラスも家庭環境も、選べません。</div>
<div class="card"><b>大石川中等教育学校とは</b><br>探究活動と行事が盛んな、6年一貫の中等教育学校(ゲーム内の設定です)。中学と高校の区切りがなく、のびのびと学べる一方、自分で考えて動く力が問われます。</div>
<div class="card"><b>イベントJSON(任意)</b><br><input type="file" id="jf" accept=".json,application/json"><label style="display:block;margin-top:6px"><input type="checkbox" id="jo"> 標準イベントを使わず、読み込んだJSONだけで遊ぶ</label><div id="jm" class="m"></div></div>
<button class="btn" id="b1">入学する</button></section>

<section class="scr" id="cls"><div class="card drum"><p class="m">クラス分け発表</p><div id="dn"></div><div id="dc"></div></div></section>

<section class="scr" id="main">

<div id="sp"><button class="btn s sel" data-sp="1">1×</button><button class="btn s" data-sp="2">2×</button><button class="btn s" data-sp="5">5×</button><button class="btn s" id="pz">⏸ 停止</button></div></div>
<div id="stage"></div>
<div class="card" id="stt"></div>
<div class="card"><b>人生の記録</b><div id="log"></div></div></section>

<section class="scr" id="end"><h1>卒業</h1><div class="card" id="res"></div><button class="btn" id="b3">もう一度入学する</button></section>
